[package]
name = "libredfish"
description = "Forge Redfish library"
authors = [
  "NVIDIA Forge Engineering <swngc-forge-dev@exchange.nvidia.com>",
  "Chris Holcombe <xfactor973@gmail.com>",
]
repository = "https://gitlab-master.nvidia.com/nvmetal/libredfish"
license = "MIT"
version = "0.29.22"
edition = "2021"

[dependencies]
async-trait = { version = "*", registry = "cratesio" }
clap = { version = "4", features = ["derive", "env"] }
log = { version = "0.4", registry = "cratesio" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
  "socks",
  "multipart",
], registry = "cratesio" }
serde = { version = "1", features = ["derive"], registry = "cratesio" }
serde_with = { version = "3.4", registry = "cratesio" }
serde_json = { version = "1", features = ["raw_value"], registry = "cratesio" }
thiserror = { version = "1", registry = "cratesio" }
tokio = { version = "1", features = ["full"], registry = "cratesio" }
tracing = { version = "0.1", registry = "cratesio" }
version-compare = { version = "0.1", registry = "cratesio" }
regex = "1.10"
chrono = "0.4.34"
urlencoding = "2.1.3"

[dev-dependencies]
anyhow = { version = "1", registry = "cratesio" }
tracing-subscriber = { version = "*", features = [
  "env-filter",
  "local-time",
], registry = "cratesio" }
