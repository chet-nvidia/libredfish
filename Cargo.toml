[package]
name = "libredfish"
description = "A redfish library. Useful for querying server hardware from a BMC."
authors = ["Chris Holcombe <xfactor973@gmail.com>", "NVIDIA Forge Engineering <swngc-forge-dev@exchange.nvidia.com>"]
repository = "https://gitlab-master.nvidia.com/nvmetal/libredfish"
documentation = "https://docs.rs/libredfish"
license = "MIT"
version = "0.3.0"
edition = "2021"

[build-dependencies]
reqwest = {version = "~0.11", features = ["blocking", "json"] }
serde_json = "~1.0"

[dependencies]
log = "~0.4"
reqwest = {version = "~0.11", features = ["blocking", "json"] }
serde_derive = "~1.0"
serde = "~1.0"
serde_with = "2.1.0"
serde_json = "~1.0"
tracing = { version = "0.1.37", registry = "cratesio" }
thiserror = { version = "1.0.38", registry = "cratesio" }
